---
# Overrides for default.config.yml. Generated from the packages installed on
# the previous Mac (2026-11-03).

# upstream dotfiles role expects files at the repo root; saya6k/dotfiles keeps
# them under config/, so tasks/post/dotfiles.yml links them instead.
