configure_terminal: false
configure_osx: false
configure_dock: false

# Used by tasks/post/dotfiles.yml.
dotfiles_repo_url: https://github.com/saya6k/dotfiles.git
dotfiles_dir: "{{ ansible_env.HOME }}/Projects/dotfiles"
